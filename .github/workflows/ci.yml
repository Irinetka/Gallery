name: Java CI

on:
  push:
    branches:
      - master
      - lab1-gallery

  pull_request:
    branches:
      - master
      - lab1-gallery

jobs:

  # 1. Unit tests
  test:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests
        run: mvn clean test



