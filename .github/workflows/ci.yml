name: Java CI

on:
  push:
    branches:
      - master
      - lab1-gallery
      - lab2
  pull_request:
    branches:
      - master
      - lab1-gallery
      - lab2

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5        # ← обновили с v4 на v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests with Maven
        run: mvn clean test -DargLine="--add-opens java.base/java.lang=ALL-UNNAMED --add-opens java.base/java.util=ALL-UNNAMED"

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maven-surefire-reports
          path: target/surefire-reports/
          retention-days: 3