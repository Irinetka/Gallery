# Используем встроенную базу данных H2 в памяти
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Настройки Hibernate для H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# create-drop создаст таблицы перед тестами и удалит их после, что гарантирует чистоту
spring.jpa.hibernate.ddl-auto=create-drop

# Можно оставить включенным для отладки, если тесты падают
spring.jpa.show-sql=false
spring.jpa.open-in-view=false